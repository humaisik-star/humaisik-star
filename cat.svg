<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170" width="200" height="170" role="img" aria-label="A pastel cat with a swishing tail">
  <style>
    .tail { transform-origin: 128px 138px; animation: swish 2.4s ease-in-out infinite; }
    @keyframes swish { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .heart { animation: float 3.2s ease-in-out infinite; opacity: 0; }
    @keyframes float { 0% { transform: translate(0,0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(6px,-28px); opacity: 0; } }
    .head { transform-origin: 92px 70px; animation: tilt 4.5s ease-in-out infinite; }
    @keyframes tilt { 0%,60%,100% { transform: rotate(0deg); } 75% { transform: rotate(-6deg); } }
  </style>

  <!-- shadow -->
  <ellipse cx="96" cy="158" rx="54" ry="6" fill="#CDB4DB" opacity="0.35"/>

  <!-- tail -->
  <g class="tail">
    <path d="M128 138 C 160 136, 170 110, 160 92 C 154 82, 146 88, 152 98 C 158 110, 150 126, 126 128 Z" fill="#CDB4DB"/>
  </g>

  <!-- body -->
  <path d="M58 156 C 52 120, 62 92, 92 90 C 122 92, 134 122, 128 156 Z" fill="#E4D4EE"/>
  <ellipse cx="93" cy="132" rx="20" ry="22" fill="#F7EAF3"/>
  <!-- paws -->
  <ellipse cx="78" cy="155" rx="11" ry="6" fill="#F7EAF3"/>
  <ellipse cx="108" cy="155" rx="11" ry="6" fill="#F7EAF3"/>

  <!-- head -->
  <g class="head">
    <path d="M58 46 L 62 18 L 80 36 Z" fill="#E4D4EE"/>
    <path d="M126 46 L 122 18 L 104 36 Z" fill="#E4D4EE"/>
    <path d="M63 40 L 65 26 L 75 36 Z" fill="#F7CAD0"/>
    <path d="M121 40 L 119 26 L 109 36 Z" fill="#F7CAD0"/>
    <ellipse cx="92" cy="62" rx="38" ry="32" fill="#E4D4EE"/>
    <!-- eyes -->
    <ellipse class="eye" cx="78" cy="60" rx="4.2" ry="5.5" fill="#4A4E69"/>
    <ellipse class="eye" cx="106" cy="60" rx="4.2" ry="5.5" fill="#4A4E69"/>
    <circle cx="79.5" cy="58" r="1.4" fill="#fff"/>
    <circle cx="107.5" cy="58" r="1.4" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="70" cy="72" rx="6" ry="3.5" fill="#F7CAD0" opacity="0.8"/>
    <ellipse cx="114" cy="72" rx="6" ry="3.5" fill="#F7CAD0" opacity="0.8"/>
    <!-- nose & mouth -->
    <path d="M89 68 L 95 68 L 92 71.5 Z" fill="#E8A0B4"/>
    <path d="M92 71.5 Q 88 76 85 73 M92 71.5 Q 96 76 99 73" stroke="#4A4E69" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#9C89B8" stroke-width="1.2" stroke-linecap="round">
      <line x1="66" y1="66" x2="48" y2="63"/><line x1="66" y1="70" x2="48" y2="72"/>
      <line x1="118" y1="66" x2="136" y2="63"/><line x1="118" y1="70" x2="136" y2="72"/>
    </g>
  </g>

  <!-- floating heart -->
  <g class="heart">
    <path d="M150 52 C 150 47, 157 46, 158 51 C 159 46, 166 47, 166 52 C 166 58, 158 62, 158 64 C 158 62, 150 58, 150 52 Z" fill="#F7CAD0"/>
  </g>
</svg>
